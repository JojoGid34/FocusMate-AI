<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusMate AI - Smart Work Monitor</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0e1a; color: #f0f4ff;
      min-height: 100vh; display: flex;
      justify-content: center; padding: 20px;
    }
    .app {
      max-width: 1400px; width: 100%;
      background: linear-gradient(145deg, #111b2e, #0d1628);
      border-radius: 28px; padding: 28px 32px 34px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
    }
    .header h1 {
      font-size: 26px;
      background: linear-gradient(135deg, #6f8cff, #ae7cff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 12px;
    }
    .header h1 small { font-size: 14px; -webkit-text-fill-color: #8899bb; font-weight: 400; }
    .status-badge {
      padding: 8px 18px; border-radius: 40px; font-size: 13px; font-weight: 700;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 8px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.green { background: #52e69d; box-shadow: 0 0 12px #52e69d66; }
    .dot.yellow { background: #ffd166; box-shadow: 0 0 12px #ffd16666; }
    .dot.red { background: #ff5f73; box-shadow: 0 0 12px #ff5f7366; animation: blink 0.6s infinite; }
    .dot.gray { background: #4a5a72; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0.3;} }

    .alarm-banner {
      display: none; padding: 16px 24px; border-radius: 16px;
      text-align: center; font-size: 18px; font-weight: 800;
      margin-bottom: 20px; border: 2px solid #ff5f73;
      background: rgba(255,95,115,0.15); color: #ff5f73;
      animation: alarm-pulse 0.8s infinite;
    }
    .alarm-banner.show { display: block; }
    @keyframes alarm-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.85; }
    }

    .main-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 16px; margin-bottom: 20px;
    }
    @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) { .main-grid { grid-template-columns: 1fr; } }

    .panel {
      background: rgba(255,255,255,0.03); border-radius: 20px;
      padding: 18px; border: 1px solid rgba(255,255,255,0.06);
    }
    .panel .label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
      color: #7a8aa5; margin-bottom: 12px;
    }

    .focus-gauge { display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .gauge-circle {
      position: relative; width: 200px; height: 200px;
      border-radius: 50%;
      background: conic-gradient(#52e69d 0deg, #52e69d 0deg, rgba(255,255,255,0.08) 0deg);
      display: grid; place-items: center; transition: background 0.5s;
    }
    .gauge-inner {
      width: 160px; height: 160px; border-radius: 50%;
      background: #0d1628;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .gauge-score { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
    .gauge-label { font-size: 11px; color: #8899bb; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .gauge-status { font-size: 18px; font-weight: 700; margin-top: 16px; letter-spacing: 0.05em; }

    .breakdown-list { display: flex; flex-direction: column; gap: 12px; }
    .breakdown-item {
      background: rgba(255,255,255,0.03);
      border-radius: 12px; padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .breakdown-item .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .breakdown-item .title { font-size: 12px; color: #b0c0d8; font-weight: 600; }
    .breakdown-item .score { font-size: 16px; font-weight: 800; }
    .breakdown-item .bar { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
    .breakdown-item .bar .fill { height: 100%; border-radius: 10px; transition: width 0.5s, background 0.5s; }

    #webcam-container {
      aspect-ratio: 1; background: #0a111f;
      border-radius: 14px; overflow: hidden;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 10px;
    }
    #webcam-container canvas { width: 100%; height: 100%; object-fit: cover; }
    .placeholder { color: #5a6a82; font-size: 13px; text-align: center; padding: 20px; }

    .face-detection {
      background: rgba(255,255,255,0.04); border-radius: 10px;
      padding: 10px 14px; text-align: center; margin-bottom: 10px;
    }
    .face-detection .label-face {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.08em; color: #7a8aa5;
    }
    .face-detection .value-face { font-size: 20px; font-weight: 800; margin-top: 2px; }

    .confidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .conf-item { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 6px 10px; font-size: 11px; }
    .conf-item .top-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .conf-item .bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
    .conf-item .bar .fill { height: 100%; border-radius: 10px; transition: width 0.15s; }

    .sensor-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #7a8aa5; margin-bottom: 10px; }
    .sensor-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sensor-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .sensor-card {
      background: rgba(255,255,255,0.03); border-radius: 14px; padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.3s; position: relative;
    }
    .sensor-card .title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #7a8aa5; margin-bottom: 4px; }
    .sensor-card .value { font-size: 22px; font-weight: 800; transition: color 0.3s; }
    .sensor-card .sub { font-size: 10px; color: #8899bb; margin-top: 2px; }
    .sensor-card .indicator { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #2a3550; }
    .sensor-card .indicator.on { background: #52e69d; box-shadow: 0 0 10px #52e69d; }
    .sensor-card .indicator.warn { background: #ffd166; box-shadow: 0 0 10px #ffd166; }
    .sensor-card .indicator.danger { background: #ff5f73; box-shadow: 0 0 10px #ff5f73; animation: blink 0.5s infinite; }

    .status-box {
      padding: 16px 20px; border-radius: 16px; text-align: center;
      border: 2px solid transparent; transition: all 0.3s; margin-bottom: 14px;
    }
    .status-box .title-status { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #7a8aa5; margin-bottom: 6px; }
    .status-box .main-status { font-size: 22px; font-weight: 800; letter-spacing: 0.03em; }
    .status-box .desc-status { font-size: 12px; color: #b0c0d8; margin-top: 4px; }
    .status-box.normal { background: rgba(82,230,157,0.08); border-color: rgba(82,230,157,0.4); }
    .status-box.normal .main-status { color: #52e69d; }
    .status-box.pantau { background: rgba(255,209,102,0.08); border-color: rgba(255,209,102,0.4); }
    .status-box.pantau .main-status { color: #ffd166; }
    .status-box.buruk { background: rgba(255,95,115,0.1); border-color: rgba(255,95,115,0.4); animation: pulse-danger 1.5s infinite; }
    .status-box.buruk .main-status { color: #ff5f73; }
    @keyframes pulse-danger { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .btn {
      padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05); color: #f0f4ff; font-weight: 600;
      cursor: pointer; transition: 0.2s; font-size: 13px; flex: 1; min-width: 130px;
    }
    .btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #6f8cff, #ae7cff); border-color: transparent; color: white; }
    .btn-success { background: linear-gradient(135deg, #52e69d, #2ecc71); border-color: transparent; color: #0a1a1a; }
    .btn-danger { background: linear-gradient(135deg, #ff5f73, #e03a4a); border-color: transparent; color: white; }
    .btn-warning { background: linear-gradient(135deg, #ffd166, #f0a500); border-color: transparent; color: #0a1a1a; }

    .tips-list { display: flex; flex-direction: column; gap: 8px; }
    .tip-item {
      background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 14px;
      font-size: 12px; color: #b0c0d8; border-left: 3px solid #6f8cff;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .tip-item.success { border-left-color: #52e69d; }
    .tip-item.warning { border-left-color: #ffd166; }
    .tip-item.danger { border-left-color: #ff5f73; }

    .log {
      background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px 16px;
      font-family: 'Courier New', monospace; font-size: 11px; color: #7a8aa5;
      max-height: 140px; overflow-y: auto; line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .log .time { color: #4a5a72; }
    .log .ok { color: #52e69d; }
    .log .err { color: #ff5f73; }
    .log .warn { color: #ffd166; }
    .log .info { color: #6f8cff; }
    .log .ai { color: #ae7cff; }

    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
    @media (max-width: 900px) { .bottom-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🎯 FocusMate AI <small>Smart Work Environment Monitor</small></h1>
    <div class="status-badge">
      <span class="dot gray" id="statusDot"></span>
      <span id="statusText">Menunggu koneksi</span>
    </div>
  </div>

  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="label">🎯 Skor Fokus</div>
      <div class="focus-gauge">
